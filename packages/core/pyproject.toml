[project]
name = "sphere-core"
version = "0.3.0"
description = "Core schemas and protocols for the SPHERE hazard loss estimation platform."
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "NiyamIT, Inc.", email = "info@niyamit.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "geopandas>=1.1.1",
    "pyarrow>=18.0.0",
]

[project.urls]
Homepage = "https://github.com/Niyam-Projects/sphere"
Issues = "https://github.com/Niyam-Projects/sphere/issues"
Changelog = "https://github.com/Niyam-Projects/sphere/blob/main/CHANGELOG.md"

[project.scripts]
sphere-core = "sphere.core:main"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sphere.core"
namespace = true