[project]
name = "sphere-flood"
version = "0.3.0"
description = "HAZUS flood vulnerability and loss analysis for SPHERE."
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "NiyamIT, Inc.", email = "info@niyamit.com" }
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "geopandas>=1.1.1",
    "numpy>=2.2.6",
    "pyarrow>=18.0.0",
    "rasterio>=1.4.3",
    "sphere-core==0.3.0",
    "sphere-data==0.3.0",
]

[project.urls]
Homepage = "https://github.com/Niyam-Projects/sphere"
Issues = "https://github.com/Niyam-Projects/sphere/issues"
Changelog = "https://github.com/Niyam-Projects/sphere/blob/main/CHANGELOG.md"

[project.scripts]
sphere-flood = "sphere.flood:main"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
sphere-core = { workspace = true }
sphere-data = { workspace = true }

[tool.uv.build-backend]
module-name = "sphere.flood"
namespace = true