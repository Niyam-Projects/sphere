[project]
name = "sphere-data"
version = "0.3.0"
description = "HAZUS lookup tables and damage curves used by SPHERE."
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "NiyamIT, Inc.", email = "info@niyamit.com" }
]
requires-python = ">=3.10"
dependencies = [
    "sphere-core==0.3.0",
]

[project.urls]
Homepage = "https://github.com/Niyam-Projects/sphere"
Issues = "https://github.com/Niyam-Projects/sphere/issues"
Changelog = "https://github.com/Niyam-Projects/sphere/blob/main/CHANGELOG.md"

[project.scripts]
sphere-data = "sphere.data:main"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
sphere-core = { workspace = true }

[tool.uv.build-backend]
module-name = "sphere.data"
namespace = true